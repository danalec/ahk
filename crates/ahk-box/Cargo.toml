[package]
name = "ahk-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The lab box as a script target: a uinput keyboard of our own, grim captures, and exact text"

[dependencies]
ahk = { workspace = true }
libc = "0.2"
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The X11 backend (`src/x11.rs`, Linux and FreeBSD only) adds NO dependency:
# it declares `dlopen`/`dlsym` by hand in `unsafe extern "C"`, resolves
# libX11.so.6 / libXtst.so.6 at runtime, and encodes captures with the `png`
# crate already listed above. It is selected with YOKO_DESKTOP=x11 and is
# additive — the uinput/Wayland path and its dependencies are unchanged.

# The Wayland protocols of the box are Linux-only: the crate of the client
# is Unix-only, and the compositor is a Linux one. The dependency is
# therefore declared for Linux alone, so that the crate keeps building on
# the other systems and answers there that it has no Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
