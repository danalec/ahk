[package]
name = "ahk-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Run an ahk script on this machine: the script on stdin, the report on stdout"
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ahk-cli"
keywords = ["autohotkey", "ahk", "scripting", "cli", "automation"]
categories = ["command-line-utilities"]
# The contracts of the review loop are working documents, not source.
exclude = ["EGM.md", "src/EGM.md"]

[[bin]]
name = "ahk"
path = "src/main.rs"
# The binary has the name of the library of the other crate of the
# workspace, and the docs of the two would be written in the same place.
# The binary has no doc of its own.
doc = false

[dependencies]
ahk = { workspace = true }
ahk-box = { workspace = true }
rgx-core = "0.1.11"

[features]
# A feature do laboratorio: o binario de Windows XP leva as funcoes
# do piso da API, e o binario do Windows de hoje nao leva.
xp = []

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
