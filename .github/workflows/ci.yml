---
name: CI

# Gate every push and every pull request the way the repository is meant to be
# gated: the workspace stays warning-free, the suite passes on the three
# systems it is written to build on, and the crate that does no I/O still
# builds without the standard library.
#
# The workflow is the one of the sibling `rgx` tree, cut to the jobs this
# workspace has.

on:
  push:
    branches: ["master"]
  pull_request:
  # The release calls the gate before it builds: a release that does not
  # pass CI is not a release, and this is what lets it ask.
  workflow_call:

# The least the workflow needs, and nothing more. The checkout reads the
# tree; no job here writes a release, a package or a comment. A step that
# wanted to push, tag or publish would fail here rather than do it by
# accident -- which is the point of the line.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    # The gate runs for the owner and for the collaborators, and for nobody
    # else. The repository is public, so the pull requests come from
    # strangers, and this job is three operating systems: every one of them
    # would spend the owner's minutes on code the owner never asked for. The
    # repository's settings hold such a pull request for approval; this is
    # the half that survives an approval given by accident.
    #
    # `author_association` says who opened the pull request. OWNER, MEMBER
    # and COLLABORATOR are the ones with a key to the tree; CONTRIBUTOR,
    # FIRST_TIME_CONTRIBUTOR and NONE are the strangers. A push is not
    # gated: only someone with write access can push, and that someone is a
    # collaborator by definition.
    #
    # The bot of the dependencies is the exception, and it is asked for by
    # name: a pull request of dependabot changes the gate itself -- the
    # version of the checkout, the version of an action -- and the gate is
    # what checks that. The pull request of a stranger still does not spend
    # the owner's minutes.
    #
    # The question is about the *author* of the pull request and not about
    # the actor of the event: the actor is who pushed the branch, and the
    # owner pushes it when the master is rewritten and the branch of the
    # bot has to be rebased on it. The author of the pull request is the
    # bot either way.
    #
    # The expression is on one line on purpose: a YAML folded scalar does not
    # fold a line that is indented further than the first, and a newline
    # inside an expression is not an expression the runner reads.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # `rustfmt` is not part of the gate: the tree is written compactly,
          # the formatter would rewrite it, and there is no `rustfmt.toml` to
          # say so. Only clippy is asked for here.
          components: clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # The surface of both dialects is what the tree promises, and the
      # parity test reads it. This step is the number a reader of a release
      # can compare against, and it fails the gate if the tree stops
      # answering a name it carried.
      - name: surface (v2 and v1)
        shell: bash
        run: |
          set -eu
          build=target/debug/ahk
          [ -f "$build" ] || build=target/debug/ahk.exe
          "$build" --surface | tail -n 1
          "$build" --surface --dialect=v1 | tail -n 1
          "$build" --surface --json > /dev/null
          "$build" --surface --dialect=v1 --json > /dev/null

  # The language crate does no I/O of its own, and it must keep building for
  # a host that has no operating system at all. The build is the proof: a
  # dependency that reaches for `std` -- directly, or through a feature
  # someone forgot was on -- has nothing to link on that target and fails
  # here and nowhere else.
  no-std:
    name: no-std (${{ matrix.target }})
    # The same gate as the job above: the owner and the collaborators, and
    # nobody else.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The target of the notes is the one the manual names; the one with
        # no architecture under it is the strictest of them and catches a
        # `std` that the other one would still find a way to link.
        target: [thumbv7em-none-eabihf, x86_64-unknown-none]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: build (no-std)
        run: cargo build -p ahk --no-default-features --target ${{ matrix.target }}

  # The desktop of a Windows machine is written for the machine of the
  # tree -- the one of sixty-four bits -- and the Windows of thirty-two
  # bits is a machine of its own: the build of it is the proof that the
  # backend of it does not reach for anything that only the machine of
  # sixty-four bits has.
  #
  # The gate builds the whole workspace, and not only the language crate:
  # the backend of the Windows is the part that talks with the machine.
  windows-32:
    name: windows (32 bits)
    # The same gate as the job above: the owner and the collaborators, and
    # nobody else.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: build (32 bits)
        run: cargo build --workspace --target i686-pc-windows-msvc

      - name: clippy (32 bits)
        run: cargo clippy --workspace --all-targets --target i686-pc-windows-msvc -- -D warnings

  # The floor of Windows XP is a promise about the import table, and the
  # gate that checks it is `scripts/xp/gate.py` over the measured floor.
  # The binary is the tier-3 `win7` target with the standard library
  # emended for the era of XP, built on a pinned nightly; the script
  # `scripts/xp/release.ps1` is the build and the gate in one, and it
  # downloads the MinGW of the `msvcrt` flavour when the machine has none.
  #
  # A new call that the XP machines do not have breaks this job, and the
  # job says so instead of the machine of the user. The two architectures
  # are gated: the thirty-two bits against the floor of XP SP3, and the
  # sixty-four bits against the floor of XP x64 SP2.
  windows-xp:
    name: windows xp (${{ matrix.target }})
    # The same gate as the job above: the owner and the collaborators, and
    # nobody else.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [i686-win7-windows-gnu, x86_64-win7-windows-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache the MinGW of the floor
        uses: actions/cache@v6
        with:
          path: ~/tools
          key: xp-mingw-${{ matrix.target }}-${{ hashFiles('scripts/xp/release.ps1') }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: xp-${{ matrix.target }}

      - name: Build and gate (XP)
        shell: powershell
        run: .\scripts\xp\release.ps1 -Target ${{ matrix.target }}

  # SIMD: the same workspace built with the vector extensions of the
  # machine turned on, so a regression in the codegen -- an intrinsic that
  # stops compiling, a target-feature that breaks the build -- is caught
  # here and not on the machine of the user. The levels are the portable
  # x86-64-v2 (SSE4.2) / v3 (AVX2) / v4 (AVX-512) and the ARM baselines.
  #
  # The flags go to the TARGET only (CARGO_TARGET_<t>_RUSTFLAGS), never to
  # the host: a global RUSTFLAGS of x86-64-v4 would build the build-scripts
  # and proc-macros with AVX-512 too, and they would SIGILL on a runner that
  # does not have it. v4 is built but not run, for the same reason; v2/v3
  # and the ARM baselines are run, because the runners have them.
  simd:
    name: simd (${{ matrix.target }})
    # The same gate as the jobs above: the owner and the collaborators, and
    # nobody else.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            flags: "-C target-cpu=x86-64-v2"
            test: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            flags: "-C target-cpu=x86-64-v3"
            test: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            flags: "-C target-cpu=x86-64-v4"
            test: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            flags: "-C target-cpu=neoverse-n1"
            test: false
            linker: aarch64-linux-gnu-gcc
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            flags: "-C target-cpu=x86-64-v3"
            test: true
          - os: windows-2022
            target: i686-pc-windows-msvc
            flags: "-C target-cpu=pentium4"
            test: false
          - os: macos-15-intel
            target: aarch64-apple-darwin
            flags: "-C target-cpu=apple-m1"
            test: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install the cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: simd-${{ matrix.target }}-${{ matrix.flags }}

      - name: build (SIMD)
        shell: bash
        env:
          FLAGS: ${{ matrix.flags }}
          LINKER: ${{ matrix.linker }}
        run: |
          set -eu
          t="${{ matrix.target }}"
          T=$(printf '%s' "$t" | tr 'a-z-' 'A-Z_')
          export CARGO_TARGET_${T}_RUSTFLAGS="$FLAGS"
          if [ -n "$LINKER" ]; then export CARGO_TARGET_${T}_LINKER="$LINKER"; fi
          cargo build --workspace --target "$t"

      - name: clippy (SIMD)
        shell: bash
        env:
          FLAGS: ${{ matrix.flags }}
          LINKER: ${{ matrix.linker }}
        run: |
          set -eu
          t="${{ matrix.target }}"
          T=$(printf '%s' "$t" | tr 'a-z-' 'A-Z_')
          export CARGO_TARGET_${T}_RUSTFLAGS="$FLAGS"
          if [ -n "$LINKER" ]; then export CARGO_TARGET_${T}_LINKER="$LINKER"; fi
          cargo clippy --workspace --all-targets --target "$t" -- -D warnings

      - name: test (SIMD)
        if: matrix.test
        shell: bash
        env:
          FLAGS: ${{ matrix.flags }}
          LINKER: ${{ matrix.linker }}
        run: |
          set -eu
          t="${{ matrix.target }}"
          T=$(printf '%s' "$t" | tr 'a-z-' 'A-Z_')
          export CARGO_TARGET_${T}_RUSTFLAGS="$FLAGS"
          if [ -n "$LINKER" ]; then export CARGO_TARGET_${T}_LINKER="$LINKER"; fi
          cargo test --workspace --target "$t"