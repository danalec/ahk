[workspace]
resolver = "3"
members = ["crates/ahk", "crates/ahk-box", "crates/ahk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
ahk = { path = "crates/ahk" }
ahk-box = { path = "crates/ahk-box" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
