[workspace]
resolver = "3"
members = ["crates/ahk", "crates/ahk-box", "crates/ahk-cli", "crates/yoko-mcp", "crates/yoko-ahk-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/danalec/yoko-ahk"

[workspace.dependencies]
ahk = { path = "crates/ahk" }
ahk-box = { path = "crates/ahk-box" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
